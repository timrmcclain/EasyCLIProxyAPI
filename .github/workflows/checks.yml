name: Checks

# The same checks release.ps1 runs before building: typecheck, unit tests, Rust tests and browser tests.
# Runs on Windows because the browser tests drive Microsoft Edge and the app targets Windows first.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@1.97.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run check

      - name: Unit tests
        run: bun test

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --quiet

      - name: Install Playwright
        shell: pwsh
        run: |
          npm install --global playwright
          # Most tests drive Edge, which the runner has; the model picker test also checks WebKit.
          playwright install webkit
          "PLAYWRIGHT_MODULE=$(npm root --global)\playwright" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Browser tests
        run: node scripts/run-ui-tests.mjs
